# Builds an installable Android app (.apk) on every push and attaches it
# to a GitHub Release, so it can be downloaded straight from a phone:
# https://github.com/RedactedR/meal-planner/releases/latest/download/meal-planner.apk
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install
          npx expo install --fix || true

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk meal-planner.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meal Planner build ${{ github.run_number }}
          body: |
            Download **meal-planner.apk** on your Android phone and open it to install.
            Built from commit ${{ github.sha }}.
          files: meal-planner.apk
          make_latest: true
